name: 1 - Testes e Qualidade de Código

# Disparo 100% manual: vá em Actions -> "1 - Testes e Qualidade de Código" -> Run workflow
on:
  workflow_dispatch:

jobs:
  test-and-quality:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crud_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: core.settings
      SECRET_KEY: ci-secret-key-github-actions
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: crud_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo, recomendado p/ análise do SonarQube

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov pylint pylint-django

      - name: Rodar os 20 testes automatizados + cobertura
        run: |
          pytest crud/tests.py --ds=core.settings --cov=. --cov-report=xml --junitxml=test-report.xml -v

      - name: Publicar estatísticas de execução dos testes
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultados dos Testes (JUnit)
          path: test-report.xml
          reporter: java-junit

      - name: Rodar Mess Detector (Pylint)
        run: |
          pylint --rcfile=.pylintrc --output-format=parseable crud core | tee pylint-report.txt || true

      - name: Análise de Qualidade de Código (SonarQube)
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Guardar relatórios gerados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-ci
          path: |
            coverage.xml
            test-report.xml
            pylint-report.txt