name: 3 - Deploy Produção

# Disparo 100% manual: vá em Actions -> "3 - Deploy Produção" -> Run workflow
on:
  workflow_dispatch:

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: producao   # opcional: configure "required reviewers" em Settings > Environments
                             # para exigir uma aprovação extra antes de liberar este job
    steps:
      - name: Deploy via SSH na VM (Produção)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/crud_basico
            docker tag crud_basico:homolog crud_basico:prod
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

      - name: Resumo
        run: echo "✅ Ambiente de Produção atualizado em http://${{ secrets.VM_HOST }}:8000"