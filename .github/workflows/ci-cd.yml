# =============================================================
# Pipeline CI/CD Unificado — CRUD de Receitas
# =============================================================
# Gatilhos:
#   • Pull Request  → roda testes + Pylint (Mess Detector)
#   • Push em main  → testes + deploy automático em Homologação
#   • Manual        → deploy em Produção (com aprovação)
# =============================================================

name: "CI/CD Pipeline"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Ambiente de deploy"
        required: true
        default: "homolog"
        type: choice
        options:
          - homolog
          - prod

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  # ============================================================
  # JOB 1 — TESTES + MESS DETECTOR (roda em TODOS os gatilhos)
  # ============================================================
  test-and-quality:
    name: "🧪 Testes & Qualidade"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crud_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: core.settings
      SECRET_KEY: ci-secret-key-github-actions
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: crud_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - name: "📥 Checkout do código"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🐍 Configurar Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "📦 Instalar dependências"
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov pylint pylint-django

      - name: "🔄 Aplicar migrations"
        run: python manage.py migrate --noinput

      - name: "🧪 Rodar 20 testes automatizados + cobertura"
        run: |
          pytest crud/tests.py \
            --ds=core.settings \
            --cov=crud --cov=core \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=test-report.xml \
            -v

      - name: "📊 Publicar resultado dos testes"
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "Resultados dos Testes (JUnit)"
          path: test-report.xml
          reporter: java-junit

      - name: "🧹 Rodar Mess Detector (Pylint)"
        run: |
          echo "## 🧹 Relatório do Mess Detector (Pylint)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pylint --rcfile=.pylintrc --output-format=text crud core | tee pylint-report.txt || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat pylint-report.txt >> $GITHUB_STEP_SUMMARY

      - name: "💾 Guardar relatórios"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-ci
          path: |
            coverage.xml
            test-report.xml
            pylint-report.txt

  # ============================================================
  # JOB 2 — DEPLOY HOMOLOGAÇÃO
  # ============================================================
  deploy-homolog:
    name: "🟡 Deploy Homologação"
    needs: test-and-quality
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'homolog')
    runs-on: self-hosted
    environment: homologacao

    steps:
      - name: "📥 Checkout do código"
        uses: actions/checkout@v4

      # ── CORREÇÃO: gera o .env aqui, pois ele está no .gitignore ──
      - name: "🔐 Gerar .env.homolog"
        run: |
          cat > .env.homolog << 'EOF'
          DEBUG=True
          SECRET_KEY=chave-secreta-homologacao
          ALLOWED_HOSTS=*
          DB_NAME=homolog_db
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=db_homolog
          DB_PORT=5432
          WEB_PORT=8001
          EOF
          # Remove espaços iniciais que o heredoc do YAML adiciona
          sed -i 's/^[[:space:]]*//' .env.homolog

      - name: "🐳 Build e deploy em Homologação"
        run: |
          docker compose -f docker-compose.homolog.yml --env-file .env.homolog down --remove-orphans || true
          docker compose -f docker-compose.homolog.yml --env-file .env.homolog up -d --build
          echo "⏳ Aguardando containers estabilizarem..."
          sleep 15
          docker compose -f docker-compose.homolog.yml --env-file .env.homolog ps

      - name: "✅ Resumo"
        run: echo "🟡 Homologação atualizada com sucesso na porta 8001"

  # ============================================================
  # JOB 3 — DEPLOY PRODUÇÃO
  # ============================================================
  deploy-prod:
    name: "🟢 Deploy Produção"
    needs: test-and-quality
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod'
    runs-on: self-hosted
    environment: producao

    steps:
      - name: "📥 Checkout do código"
        uses: actions/checkout@v4

      # ── CORREÇÃO: gera os .env aqui ──
      - name: "🔐 Gerar arquivos .env"
        run: |
          cat > .env.homolog << 'EOF'
          DEBUG=True
          SECRET_KEY=chave-secreta-homologacao
          ALLOWED_HOSTS=*
          DB_NAME=homolog_db
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=db_homolog
          DB_PORT=5432
          WEB_PORT=8001
          EOF
          sed -i 's/^[[:space:]]*//' .env.homolog

          cat > .env.prod << 'EOF'
          DEBUG=False
          SECRET_KEY=chave-secreta-producao-super-segura
          ALLOWED_HOSTS=*
          DB_NAME=prod_db
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=db_prod
          DB_PORT=5432
          WEB_PORT=8000
          EOF
          sed -i 's/^[[:space:]]*//' .env.prod

      - name: "🐳 Promover para Produção"
        run: |
          # Garante que a imagem de homolog existe
          if ! docker image inspect crud_basico:homolog > /dev/null 2>&1; then
            echo "⚠️ Imagem de homolog não encontrada. Construindo..."
            docker compose -f docker-compose.homolog.yml --env-file .env.homolog build
          fi

          # Promove a imagem
          docker tag crud_basico:homolog crud_basico:prod

          # Sobe produção
          docker compose -f docker-compose.prod.yml --env-file .env.prod down --remove-orphans || true
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
          echo "⏳ Aguardando containers estabilizarem..."
          sleep 15
          docker compose -f docker-compose.prod.yml --env-file .env.prod ps

      - name: "✅ Resumo"
        run: echo "🟢 Produção atualizada com sucesso na porta 8000"